name: Validar Smart Library
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compilar Python
        run: python -m compileall -q Servidor
      - name: Testar API e permissões
        run: python -m unittest discover -s tests -v
      - name: Verificar JavaScript
        run: node --check Interface/app.js
